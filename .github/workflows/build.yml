name: APK 빌드

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 의존성 설치
        run: npm ci

      - name: 라이브러리 묶기 (www/libs)
        run: npm run libs

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      # 서명 키는 저장소에 두지 않고 GitHub Secrets에서 꺼내 쓴다.
      # (포크처럼 Secrets가 없는 곳에서는 디버그 서명으로 빌드한다.)
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: 인텐트 필터·버전·서명 적용
        run: npm run android:patch

      - name: 웹 자산 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_KIND" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../hanreader-$VERSION_NAME.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../hanreader-$VERSION_NAME.apk"
          fi

      - name: 서명 확인
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs hanreader-*.apk | grep -E "DN|SHA-256"

      - name: 서명 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: hanreader-apk
          path: hanreader-*.apk

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          if [ "$BUILD_KIND" = "release" ]; then
            NOTES="자동 빌드된 시험판입니다. v0.1.2부터는 같은 키로 서명되어 이전 판 위에 그대로 덮어 설치됩니다. (v0.1.1을 쓰고 있었다면 한 번만 지우고 설치해 주세요.)"
          else
            NOTES="자동 빌드된 시험판입니다(디버그 서명). 새 판을 설치할 때 이전 판을 먼저 지워야 할 수 있습니다."
          fi
          gh release create "$TAG" hanreader-*.apk \
            --target "${{ github.sha }}" \
            --title "한리더 $TAG" \
            --notes "$NOTES"
